services:
  civitas-access:
    build: .
    image: ${CIVITAS_IMAGE:-civitas-access:local}
    # Ejecuta como el UID/GID del host para poder escribir en ./data (SQLite).
    user: '${CIVITAS_UID:-1000}:${CIVITAS_GID:-1000}'
    ports:
      - '8790:8790'
    # Los secretos (ADMIN_PASSWORD, SESSION_SECRET, API_KEY_PEPPER, EXPO_ACCESS_TOKEN)
    # viven en .env, nunca en este archivo.
    env_file:
      - path: .env
        required: true
    environment:
      PORT: '8790'
      DATABASE_PATH: /app/data/push.sqlite
      TRUST_PROXY: '${TRUST_PROXY:-false}'
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
